<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Tichý večerní zápis pro sebe."><title>Večerní zápis | Síla myšlenky</title><style>:root{--bg:#0d0b0e;--text:#f5f0ed;--muted:#c5bac0;--pink:#ff4f9a;--line:#ffffff24}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 78% 10%,#4a1e35,transparent 30%),var(--bg);color:var(--text);font:17px/1.7 Arial,sans-serif}.wrap{width:min(760px,calc(100% - 40px));margin:auto}header{border-bottom:1px solid var(--line);background:#0d0b0ee8;position:sticky;top:0;backdrop-filter:blur(14px)}.nav{height:72px;display:flex;justify-content:space-between;align-items:center}.brand,.back{color:#fff;text-decoration:none;font-weight:900}.brand b,.eyebrow{color:var(--pink)}main{padding:88px 0}.eyebrow{font-size:.75rem;letter-spacing:.16em;font-weight:900}.hero h1{font-size:clamp(3rem,7vw,5.5rem);line-height:.94;letter-spacing:-.07em;margin:14px 0}.hero p{color:var(--muted);font-size:1.12rem;max-width:610px}.card{margin-top:38px;padding:clamp(22px,5vw,42px);border:1px solid var(--line);border-radius:24px;background:#ffffff08}.field{display:block;margin:0 0 24px;font-weight:900}.field span{display:block;margin-bottom:8px}textarea{display:block;width:100%;min-height:112px;resize:vertical;border:1px solid #ffffff2a;border-radius:14px;background:#0c090d;color:#fff;padding:14px;font:16px/1.6 Arial,sans-serif}textarea:focus{outline:2px solid #ff4f9a66;border-color:var(--pink)}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.button{border:0;border-radius:999px;background:var(--pink);color:#210a16;padding:.78rem 1.1rem;font:900 1rem Arial;cursor:pointer}.status{color:var(--muted);font-size:.9rem}.note{margin-top:30px;color:var(--muted)}.history{margin-top:35px;border-top:1px solid var(--line);padding-top:24px}.entry{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px;white-space:pre-wrap;color:#ddd}.entry strong{display:block;color:#ff85bb;margin-bottom:8px;font-size:.8rem;letter-spacing:.08em}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html">Síla <b>myšlenky</b></a><a class="back" href="index.html#blog">Číst blog →</a></div></header><main class="wrap"><section class="hero"><div class="eyebrow">VEČERNÍ ZÁPIS</div><h1>Nech dnešek na chvíli doznít.</h1><p>Tři krátké otázky pro chvíli, kdy si chceš ujasnit, co se v tobě dnes odehrálo. Zápisy zůstávají jen v tomto zařízení.</p></section><section class="card"><label class="field"><span>Co mě dnes bolelo nebo zatížilo?</span><textarea id="heavy" placeholder="Stačí pár vět."></textarea></label><label class="field"><span>Co mi dnes aspoň trochu pomohlo?</span><textarea id="helped" placeholder="Klidně i úplná maličkost."></textarea></label><label class="field"><span>Co si chci zítra připomenout?</span><textarea id="tomorrow" placeholder="Jedna věta pro zítřejší sebe."></textarea></label><div class="actions"><button class="button" id="save">Uložit dnešní zápis</button><span class="status" id="status" aria-live="polite"></span></div><p class="note">Web je neodesílá ani nikam nenahrává. Když v prohlížeči smažeš data webu, smažou se i zápisy.</p><div class="history" id="history"></div></section></main><script>const key='sm-evening-notes';const ids=['heavy','helped','tomorrow'];const read=()=>JSON.parse(localStorage.getItem(key)||'[]');const render=()=>{const data=read();const box=document.querySelector('#history');box.innerHTML=data.length?'<div class="eyebrow">POSLEDNÍ ZÁPISY</div>'+data.slice(0,5).map(x=>'<div class="entry"><strong>'+x.date+'</strong><b>Co mě zatížilo</b>\n'+escape(x.heavy)+'\n\n<b>Co mi pomohlo</b>\n'+escape(x.helped)+'\n\n<b>Na zítřek</b>\n'+escape(x.tomorrow)+'</div>').join(''):'<p class="note">Tady se po uložení objeví tvoje poslední zápisy.</p>'};const escape=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));document.querySelector('#save').onclick=()=>{const x=Object.fromEntries(ids.map(i=>[i,document.querySelector('#'+i).value.trim()]));if(!x.heavy&&!x.helped&&!x.tomorrow){document.querySelector('#status').textContent='Napiš alespoň jednu větu.';return}const d=new Date().toLocaleDateString('cs-CZ',{day:'numeric',month:'long',year:'numeric'});localStorage.setItem(key,JSON.stringify([{date:d,...x},...read()].slice(0,30)));ids.forEach(i=>document.querySelector('#'+i).value='');document.querySelector('#status').textContent='Zápis je uložený jen v tomto zařízení.';render()};render();</script><!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "b542733f5096473eb1f3784915fd044a"}'></script><!-- End Cloudflare Web Analytics --></body></html>
