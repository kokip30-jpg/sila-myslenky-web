<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Tři malé kroky pro den, kdy je toho moc."><meta name="robots" content="noindex"><title>Moje malé kroky | Síla myšlenky</title><style>:root{--ink:#0d0b0e;--paper:#f5f0ed;--pink:#ff4f9a;--pink2:#fc85bb;--muted:#bdb5b9;--line:#ffffff24}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 82% 10%,#532039,transparent 32%),var(--ink);color:var(--paper);font:17px/1.7 Arial,Helvetica,sans-serif}.wrap{width:min(820px,calc(100% - 36px));margin:auto}a{text-decoration:none;color:inherit}header{border-bottom:1px solid var(--line);background:#0d0b0ed9;backdrop-filter:blur(12px)}.nav{height:76px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:1.15rem}.brand b,.eyebrow{color:var(--pink)}.back{font-weight:800;color:#ddd}.hero{padding:78px 0 32px}.eyebrow{font-size:.75rem;letter-spacing:.16em;font-weight:900}.hero h1{font-size:clamp(3rem,8vw,5.6rem);letter-spacing:-.075em;line-height:.92;margin:13px 0 20px}.hero p{max-width:620px;color:#d5c9d0;font-size:1.12rem}.date{color:#ff9ac6;font-weight:800}.steps{display:grid;gap:12px;padding:20px 0 34px}.step{display:flex;gap:16px;align-items:flex-start;padding:20px;border:1px solid var(--line);border-radius:18px;background:#ffffff08;cursor:pointer;transition:.2s}.step:hover{border-color:#ff4f9a}.step.done{border-color:#ff4f9a;background:#ff4f9a18}.step input{appearance:none;width:25px;height:25px;flex:0 0 25px;border:2px solid #e9dce4;border-radius:50%;margin:3px 0 0;display:grid;place-content:center}.step input:checked{border-color:#ff4f9a;background:#ff4f9a}.step input:checked:after{content:'✓';font-size:16px;color:#210b16;font-weight:900}.step h2{font-size:1.3rem;line-height:1.1;letter-spacing:-.035em;margin:0 0 6px}.step p{margin:0;color:var(--muted)}.progress{margin:8px 0 52px;padding:18px 20px;border-radius:16px;background:#ffffff0a;border:1px solid var(--line)}.progress strong{display:block;margin-bottom:8px}.bar{height:8px;border-radius:99px;background:#ffffff18;overflow:hidden}.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ff4f9a,#ff9ac6);transition:.25s}.quiet{border-top:1px solid var(--line);padding:28px 0 70px;color:var(--muted)}.button{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:.7rem 1rem;color:#fff;font-weight:800;margin-right:.5rem}@media(max-width:600px){.hero{padding-top:55px}}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html">Síla <b>myšlenky</b></a><a class="back" href="index.html">← Zpět</a></div></header><main class="wrap"><section class="hero"><div class="eyebrow">JEN PRO DNEŠEK</div><h1>Moje malé kroky.</h1><p>Nemusíš zvládnout celý den najednou. Vyber si jednu věc, která ti dnes může ulevit. Vše zůstává jen v tomto prohlížeči.</p><div class="date" id="date"></div></section><section class="steps" id="steps"><label class="step"><input type="checkbox" data-step="1"><div><h2>Postarám se o tělo</h2><p>Napiju se vody, dám si něco k jídlu nebo se na chvíli projdu.</p></div></label><label class="step"><input type="checkbox" data-step="2"><div><h2>Udělám si trochu prostoru</h2><p>Na deset minut odložím telefon, otevřu okno nebo ztiším, co na mě mluví.</p></div></label><label class="step"><input type="checkbox" data-step="3"><div><h2>Udělám jednu drobnost pro zítřek</h2><p>Připravím si oblečení, odpovím na jednu zprávu nebo si napíšu, co potřebuji.</p></div></label></section><section class="progress"><strong id="status">Dnes zatím nic nemusíš odškrtnout.</strong><div class="bar"><i id="bar"></i></div></section><section class="quiet"><a class="button" href="dnesni-veta.html">Dnešní věta →</a><a class="button" href="vecerni-zapis.html">Večerní zápis →</a></section></main><script>const day=new Date().toLocaleDateString('cs-CZ',{day:'numeric',month:'long',year:'numeric'});document.querySelector('#date').textContent=day;const key='sm-small-steps-'+new Date().toISOString().slice(0,10);const saved=JSON.parse(localStorage.getItem(key)||'{}');const boxes=[...document.querySelectorAll('[data-step]')];function update(){let n=0;boxes.forEach(x=>{x.checked=!!saved[x.dataset.step];x.closest('.step').classList.toggle('done',x.checked);n+=x.checked?1:0});document.querySelector('#bar').style.width=(n/3*100)+'%';document.querySelector('#status').textContent=n===0?'Dnes zatím nic nemusíš odškrtnout.':n===3?'To pro dnešek stačí. Udělal jsi dost.':`Máš hotovo ${n} ze 3 malých kroků.`}boxes.forEach(x=>x.onchange=()=>{saved[x.dataset.step]=x.checked;localStorage.setItem(key,JSON.stringify(saved));update()});update();</script><!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "b542733f5096473eb1f3784915fd044a"}'></script><!-- End Cloudflare Web Analytics --></body></html>
