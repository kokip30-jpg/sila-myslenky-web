<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Archiv článků Síly myšlenky o rozchodech, vztazích a návratu k sobě."><link rel="canonical" href="https://sila-myslenky.com/blog/"><title>Blog | Síla myšlenky</title><style>:root{--bg:#1c1b33;--bg2:#26233f;--ink:#f3e9e2;--muted:#b4adc6;--rose:#e8b4b8;--line:rgba(243,233,226,.14);--glass:rgba(38,35,63,.58)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(100% 70% at 80% 0%,var(--bg2),var(--bg) 65%);color:var(--ink);font:400 17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(980px,calc(100% - 38px));margin:auto}a{color:inherit;text-decoration:none}header{position:sticky;top:0;z-index:2;background:#1c1b33dc;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.nav{height:68px;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font:500 26px/1 Georgia,serif}.back{color:var(--muted);font-weight:600}.hero{padding:76px 0 30px}.eyebrow,.tag{font-size:.74rem;font-weight:800;letter-spacing:.15em;color:var(--rose)}h1{font:400 clamp(44px,7vw,76px)/.98 Georgia,serif;letter-spacing:-.04em;margin:14px 0}p{color:var(--muted);max-width:56ch}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:24px 0}.filter{padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:700 14px inherit;cursor:pointer}.filter.active,.filter:hover{border-color:var(--rose);background:rgba(232,180,184,.14)}.list{display:grid;gap:12px;padding:22px 0}.card{display:block;padding:22px 24px;border:1px solid var(--line);border-radius:18px;background:var(--glass);transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-2px);border-color:var(--rose)}.card h2{font:400 clamp(24px,4vw,32px)/1.13 Georgia,serif;margin:5px 0 8px}.card p{font-size:.94rem;margin:0}.card time{display:block;margin-top:12px;color:var(--muted);font-size:.84rem}.pager{display:flex;justify-content:center;gap:10px;padding:18px 0 75px}.pager button{border:1px solid var(--line);border-radius:999px;background:var(--glass);padding:10px 15px;color:var(--ink);cursor:pointer;font-weight:700}.pager button:disabled{opacity:.38;cursor:default}@media(max-width:600px){.hero{padding-top:52px}.card{padding:18px}.nav{height:62px}}</style></head><body><header><div class="wrap nav"><a class="brand" href="../index.html">Síla myšlenky</a><a class="back" href="../index.html">← Zpět na úvod</a></div></header><main class="wrap"><section class="hero"><div class="eyebrow">BLOG</div><h1>Čtení pro dny, kdy je toho moc.</h1><p>Vyber si podle toho, co právě prožíváš. Každý nový článek se do archivu přidá automaticky.</p></section><nav class="filters" aria-label="Rubriky"><button class="filter active" data-cat="all">Všechny</button><button class="filter" data-cat="Pustit a přijmout konec">Pustit a přijmout konec</button><button class="filter" data-cat="Vztahy a rozchody">Vztahy a rozchody</button><button class="filter" data-cat="Návrat k sobě">Návrat k sobě</button></nav><section class="list" id="list"><p>Načítám články…</p></section><nav class="pager" id="pager" aria-label="Stránkování"></nav></main><script>const list=document.querySelector('#list'),pager=document.querySelector('#pager');let all=[],active='all',page=1;const per=8;const cat=s=>{s=(s||'').toLowerCase();if(s.includes('návrat'))return 'Návrat k sobě';if(s.includes('vztah'))return 'Vztahy a rozchody';return 'Pustit a přijmout konec'};const text=n=>n?.textContent.trim().replace(/\s+/g,' ')||'';function render(){const set=active==='all'?all:all.filter(x=>x.category===active),pages=Math.max(1,Math.ceil(set.length/per));page=Math.min(page,pages);const now=set.slice((page-1)*per,page*per);list.innerHTML=now.map(a=>`<a class="card" href="${a.url}"><div class="tag">${a.category}</div><h2>${a.title}</h2><p>${a.description}</p><time datetime="${a.dateISO}">${a.date}</time></a>`).join('')||'<p>V této rubrice zatím nejsou články.</p>';pager.innerHTML=pages>1?`<button ${page===1?'disabled':''} data-p="${page-1}">← Novější</button><span style="padding:10px;color:var(--muted)">${page} / ${pages}</span><button ${page===pages?'disabled':''} data-p="${page+1}">Starší →</button>`:'';pager.querySelectorAll('button').forEach(b=>b.onclick=()=>{page=+b.dataset.p;render();scrollTo({top:0,behavior:'smooth'})})}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{active=b.dataset.cat;page=1;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});(async()=>{try{const xml=await(await fetch('../sitemap.xml',{cache:'no-store'})).text();const urls=[...xml.matchAll(/<loc>(https:\/\/sila-myslenky\.com\/blog\/[^<]+\.html)<\/loc>/g)].map(m=>m[1]).reverse();all=await Promise.all(urls.map(async url=>{const doc=new DOMParser().parseFromString(await(await fetch(url,{cache:'no-store'})).text(),'text/html');const d=text(doc.querySelector('time,.article-date,.date'))||'Bez uvedeného data';return{url,title:text(doc.querySelector('h1'))||'Článek Síly myšlenky',description:doc.querySelector('meta[name="description"]')?.content||'Otevřít článek.',category:cat(text(doc.querySelector('.eyebrow,.tag'))),date:d,dateISO:doc.querySelector('time')?.dateTime||''}}));render()}catch{list.innerHTML='<p>Archiv se nepodařilo načíst. Obnov stránku a zkus to znovu.</p>'}})();</script><!-- Cloudflare Web Analytics --><script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"b542733f5096473eb1f3784915fd044a"}'></script></body></html>
