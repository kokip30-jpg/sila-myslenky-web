name: Create article audio

on:
  push:
    branches: [main]
    paths:
      - 'blog/**/*.html'
      - 'scripts/generate_audio.py'
      - '.github/workflows/article-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  narrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Azure Speech MP3 files
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: eastus
        run: python scripts/generate_audio.py
      - name: Publish audio files
        run: |
          git config user.name "Síla myšlenky audio"
          git config user.email "actions@github.com"
          git add blog audio
          if git diff --cached --quiet; then
            echo "No audio changes."
          else
            git commit -m "Add narrated article audio"
            git push
          fi
