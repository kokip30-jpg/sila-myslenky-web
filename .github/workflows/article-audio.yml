name: Create article audio

on:
  push:
    branches: [main]
    paths:
      - 'blog/**/*.html'
      - 'scripts/generate_audio.py'
      - 'scripts/prepare_articles.py'
      - 'scripts/build_catalogs.py'
      - 'scripts/build_sitemap.py'
      - '.github/workflows/article-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: article-audio-main
  cancel-in-progress: false

jobs:
  narrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare article pages
        run: python scripts/prepare_articles.py
      - name: Generate Azure Speech MP3 files
        id: speech
        continue-on-error: true
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: eastus
        run: python scripts/generate_audio.py
      - name: Update search and listening lists
        run: python scripts/build_catalogs.py
      - name: Update sitemap
        run: python scripts/build_sitemap.py
      - name: Publish article assets and catalogs
        run: |
          git config user.name "Síla myšlenky audio"
          git config user.email "actions@github.com"
          git add blog audio data/clanky.json data/poslech.json sitemap.xml
          if git diff --cached --quiet; then
            echo "No audio changes."
          else
            git commit -m "Add narrated article audio"
            # A new article can be published while synthesis is running.
            # Rebase the audio commit onto it instead of failing the whole run.
            git pull --rebase origin main
            git push
          fi
      - name: Report speech synthesis failure
        if: steps.speech.outcome == 'failure'
        run: |
          echo "Azure Speech failed; article pages and catalogs were still published. Check AZURE_SPEECH_KEY and AZURE_SPEECH_REGION." >&2
          exit 1
