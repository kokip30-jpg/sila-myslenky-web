<!doctype html>
<html lang="cs"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Všechny články Síly myšlenky."><meta name="robots" content="noindex">
<title>Všechny články | Síla myšlenky</title>
<style>
:root{--bg:#1c1b33;--bg2:#26233f;--ink:#f3e9e2;--muted:#b4adc6;--rose:#e8b4b8;--line:rgba(243,233,226,.14);--glass:rgba(38,35,63,.6)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(100% 70% at 80% 0%,var(--bg2),var(--bg) 65%);color:var(--ink);font:400 17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(940px,calc(100% - 38px));margin:auto}a{color:inherit;text-decoration:none}header{position:sticky;top:0;z-index:2;background:#1c1b33db;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.nav{height:68px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font:500 26px/1 Georgia,serif}.back{color:var(--muted);font-weight:600}.hero{padding:80px 0 35px}.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.16em;color:var(--rose)}h1{font:400 clamp(44px,7vw,76px)/.98 Georgia,serif;letter-spacing:-.04em;margin:14px 0}p{color:var(--muted);max-width:55ch}.search{width:100%;padding:17px 19px;border-radius:16px;background:var(--glass);border:1px solid var(--line);color:var(--ink);font:inherit;outline:0}.search:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(232,180,184,.13)}.count{display:block;margin:20px 0 12px;color:var(--muted);font-size:.9rem}.list{display:grid;gap:12px;padding-bottom:70px}.card{display:block;padding:22px 24px;border:1px solid var(--line);border-radius:18px;background:var(--glass);transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-2px);border-color:var(--rose)}.card h2{font:400 clamp(24px,4vw,32px)/1.13 Georgia,serif;margin:5px 0 8px}.card p{font-size:.94rem;margin:0}.card small{font-size:.73rem;font-weight:800;letter-spacing:.12em;color:var(--rose)}.loading{color:var(--muted);padding:18px 0}@media(max-width:600px){.hero{padding-top:55px}.card{padding:18px}.nav{height:62px}}
</style></head><body>
<header><div class="wrap nav"><a class="brand" href="index.html">Síla myšlenky</a><a class="back" href="index.html">← Zpět na úvod</a></div></header>
<main class="wrap"><section class="hero"><div class="eyebrow">BLOG</div><h1>Všechny články</h1><p>Vyber si text podle toho, co právě prožíváš. Každý nový článek se sem přidá automaticky.</p></section><input class="search" id="search" type="search" placeholder="Hledat v článcích, třeba: stýská se mi, rozchod, návrat k sobě" aria-label="Hledat v článcích"><span class="count" id="count">Načítám články…</span><section class="list" id="list"><p class="loading">Připravuji přehled článků…</p></section></main>
<script>
const list=document.querySelector('#list'),input=document.querySelector('#search'),count=document.querySelector('#count');let articles=[];
const clean=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function draw(){const q=clean(input.value.trim());const found=articles.filter(a=>!q||clean(a.title+' '+a.description).includes(q)||q.split(/\s+/).some(w=>clean(a.title+' '+a.description).includes(w)));count.textContent=found.length+' '+(found.length===1?'článek':'článků');list.innerHTML=found.length?found.map(a=>`<a class="card" href="${a.url}"><small>ČÍST ČLÁNEK</small><h2>${a.title}</h2><p>${a.description}</p></a>`).join(''):'<p class="loading">Pro tato slova zatím nemám přesný článek. Zkus jiné slovo.</p>'}
(async()=>{try{const xml=await (await fetch('sitemap.xml',{cache:'no-store'})).text();const urls=[...xml.matchAll(/<loc>(https:\/\/sila-myslenky\.com\/blog\/[^<]+)<\/loc>/g)].map(m=>m[1]).reverse();articles=await Promise.all(urls.map(async url=>{try{const doc=new DOMParser().parseFromString(await (await fetch(url,{cache:'no-store'})).text(),'text/html');return {url,title:doc.querySelector('h1')?.textContent.trim()||doc.title.replace(/\s*\|.*$/,''),description:doc.querySelector('meta[name="description"]')?.content||'Otevřít článek.'}}catch{return {url,title:'Článek Síly myšlenky',description:'Otevřít článek.'}}}));draw()}catch{count.textContent='Články se nepodařilo načíst.';list.innerHTML='<p class="loading">Obnov stránku a zkus to znovu.</p>'}})();input.addEventListener('input',draw);
</script>

</body></html>
