<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Vaše soukromě uložené články ze Síly myšlenky."><meta name="robots" content="noindex"><title>Moje uložené články | Síla myšlenky</title><style>:root{--ink:#0d0b0e;--paper:#f5f0ed;--pink:#ff4f9a;--pink2:#fc85bb;--muted:#bdb5b9;--line:#ffffff24}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 12%,#4f2038,transparent 27%),var(--ink);color:var(--paper);font:17px/1.7 Arial,Helvetica,sans-serif}.wrap{width:min(850px,calc(100% - 40px));margin:auto}header{position:sticky;top:0;background:#0d0b0ee8;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.nav{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:1.18rem;color:#fff;text-decoration:none}.brand b,.eyebrow{color:var(--pink)}.nav a:not(.brand){color:#fff;text-decoration:none;font-weight:800}.hero{padding:100px 0 54px}.eyebrow{font-size:.75rem;letter-spacing:.16em;font-weight:900}.hero h1{font-size:clamp(3.1rem,8vw,6rem);line-height:.92;letter-spacing:-.075em;max-width:760px;margin:14px 0}.hero p{color:#d7cbd0;font-size:1.14rem}.quote-card{border:1px solid #ff4f9a65;border-radius:28px;padding:clamp(28px,7vw,70px);background:linear-gradient(135deg,#ff4f9a18,#ffffff06);font:clamp(2rem,5vw,4.2rem)/1.02 Georgia,serif;letter-spacing:-.055em}.quote-card:before{content:"„";display:block;color:var(--pink);font:5rem/.5 Georgia,serif;margin-bottom:.35rem}.actions{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:25px}.button{background:var(--pink);color:#260a17!important;border:0;border-radius:999px;padding:.75rem 1.05rem;font:800 1rem Arial;text-decoration:none;cursor:pointer}.button.ghost{background:transparent;color:#fff!important;border:1px solid var(--line)}.content{padding:35px 0 90px}.saved{display:grid;gap:12px}.saved a{padding:18px;border:1px solid var(--line);border-radius:16px;color:#fff;text-decoration:none;font-weight:800}.saved a:hover{border-color:var(--pink)}.empty{color:var(--muted)}.footer{padding:35px 0;color:var(--muted);border-top:1px solid var(--line)}@media(max-width:600px){.hero{padding-top:72px}} </style></head><body><header><div class="wrap nav"><a class="brand" href="index.html">Síla <b>myšlenky</b></a><a href="index.html#blog">Číst blog →</a></div></header><main class="wrap"><section class="hero"><div class="eyebrow">JEN PRO TEBE</div><h1>Moje uložené články.</h1><p>Uložené položky zůstávají jen v tomto prohlížeči. Nikam je neposíláme.</p></section><section class="content"><div class="saved" id="saved"></div></section></main><footer class="footer"><div class="wrap">Síla myšlenky</div></footer><script>const box=document.querySelector('#saved'),items=JSON.parse(localStorage.getItem('sm-saved')||'[]');if(!items.length)box.innerHTML='<p class="empty">Zatím tu nic není. U článku můžeš zvolit „Uložit na později“.</p>';else items.forEach(x=>{const a=document.createElement('a');a.href=x.url;a.textContent=x.title;box.appendChild(a)});</script></body></html>
